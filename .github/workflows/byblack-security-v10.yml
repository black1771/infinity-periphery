name: Byblack Security Hunter V24

on:
  workflow_dispatch:

jobs:
  security-v24:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run V24 tests
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/ByblackSequenceV24.t.sol' \
            -vvv
