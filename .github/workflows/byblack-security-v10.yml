name: Byblack Automated Hunter V17

on:
  workflow_dispatch:

jobs:
  security-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout V17
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify V17 exists
        run: |
          grep -q \
            'function testFuzz_byblack_V17_authorizationInvariant' \
            test/pool-cl/position-managers/CLPositionManager.t.sol

      - name: Run 1000 fuzz tests
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/CLPositionManager.t.sol' \
            --match-test '^testFuzz_byblack_V17_authorizationInvariant$' \
            --fuzz-runs 1000 \
            -vvv
