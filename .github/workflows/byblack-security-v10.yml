name: Byblack Security V14

on:
  workflow_dispatch:

jobs:
  security-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V14 branch
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify V14 test exists
        run: |
          grep -q \
            'function test_byblack_V14_unauthorizedDecrease()' \
            test/pool-cl/position-managers/CLPositionManager.t.sol

      - name: Run V14 unauthorized decrease test
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/CLPositionManager.t.sol' \
            --match-test '^test_byblack_V14_unauthorizedDecrease$' \
            -vvv
