name: Byblack Stateful Hunter V19

on:
  workflow_dispatch:

jobs:
  security-v19:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FOUNDRY_INVARIANT_RUNS: "256"
      FOUNDRY_INVARIANT_DEPTH: "100"

    steps:
      - name: Checkout V19
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify V19 exists
        run: |
          test -f test/pool-cl/position-managers/ByblackInvariantV19.t.sol

      - name: Run V19 invariant tests
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/ByblackInvariantV19.t.sol' \
            -vvv
