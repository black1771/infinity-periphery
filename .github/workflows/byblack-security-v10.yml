name: Byblack Security V11

on:
  workflow_dispatch:

jobs:
  security-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify regression test exists
        run: |
          grep -q \
            'function test_byblack_revertingSubscriber_preservesPositionAndBalances()' \
            test/pool-cl/position-managers/CLPositionManager.notifier.sol

      - name: Reentrancy tests
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/CLPositionManager.notifier.sol' \
            --match-test 'test_(unsubscribe_reverts_VaultMustBeUnlocked|subscribe_reverts_VaultMustBeUnlocked|transferFrom_reverts_VaultMustBeUnlocked)' \
            --fail-if-no-tests -vv

      - name: Balance protection test
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/CLPositionManager.notifier.sol' \
            --match-test '^test_byblack_revertingSubscriber_preservesPositionAndBalances$' \
            --fail-if-no-tests -vv
