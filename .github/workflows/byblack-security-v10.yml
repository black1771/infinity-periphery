name: Byblack Security V15

on:
  workflow_dispatch:

jobs:
  security-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V15 branch
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify V15 test exists
        run: |
          grep -q \
            'function test_byblack_V15_multiactionAtomicRollback()' \
            test/pool-cl/position-managers/CLPositionManager.t.sol

      - name: Run V15 atomic rollback test
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/CLPositionManager.t.sol' \
            --match-test '^test_byblack_V15_multiactionAtomicRollback$' \
            -vvv
