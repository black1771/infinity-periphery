name: Byblack Security V16

on:
  workflow_dispatch:

jobs:
  security-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V16 branch
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify V16 test exists
        run: |
          grep -q \
            'function test_byblack_V16_actionOrdering()' \
            test/pool-cl/position-managers/CLPositionManager.t.sol

      - name: Run V16 action ordering test
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/CLPositionManager.t.sol' \
            --match-test '^test_byblack_V16_actionOrdering$' \
            -vvv
