name: Byblack Stateful Hunter V20

on:
  workflow_dispatch:

jobs:
  security-v20:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FOUNDRY_INVARIANT_RUNS: "256"
      FOUNDRY_INVARIANT_DEPTH: "100"

    steps:
      - name: Checkout V20
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify V20
        run: |
          test -f test/pool-cl/position-managers/ByblackInvariantV20.t.sol

      - name: Run V20 invariants
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/ByblackInvariantV20.t.sol' \
            -vvv
