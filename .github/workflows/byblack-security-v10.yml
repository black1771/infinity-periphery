name: Byblack Security Hunter V27

on:
  workflow_dispatch:

jobs:
  security-v27:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run V27 accounting tests
        run: |
          forge test \
            --match-contract ByblackAccountingV27 \
            -vvv
