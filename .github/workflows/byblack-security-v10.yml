name: Byblack Security Hunter V26

on:
  workflow_dispatch:

jobs:
  security-v26:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run V26 permit security tests
        run: |
          forge test \
            --match-contract ByblackPermitV26 \
            -vvv
