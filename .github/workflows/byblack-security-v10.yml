name: Byblack Stateful Hunter V18

on:
  workflow_dispatch:

jobs:
  security-v18:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FOUNDRY_INVARIANT_RUNS: "256"
      FOUNDRY_INVARIANT_DEPTH: "100"

    steps:
      - name: Checkout V18
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify V18 exists
        run: |
          grep -q \
            'contract ByblackInvariantV18' \
            test/pool-cl/position-managers/ByblackInvariantV18.t.sol

      - name: Run stateful invariant tests
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/ByblackInvariantV18.t.sol' \
            -vvv
