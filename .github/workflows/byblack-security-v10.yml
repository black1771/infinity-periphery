name: Byblack Security V13

on:
  workflow_dispatch:

jobs:
  security-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/byblack-notifier-ci
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify V13 test exists
        run: |
          grep -q \
            'function test_byblack_sweep_leftoverTokens()' \
            test/pool-cl/position-managers/ByblackSweepV13.t.sol

      - name: Run SWEEP V13 test
        run: |
          forge test \
            --match-path 'test/pool-cl/position-managers/ByblackSweepV13.t.sol' \
            --match-test '^test_byblack_sweep_leftoverTokens$' \
            -vvv
